name: Build POWDER

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libsdl1.2-dev libsdl-image1.2-dev libsdl-ttf2.0-dev
    
    - name: Build
      run: |
        chmod +x buildall.sh
        ./buildall.sh
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: powder-linux
        path: powder

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        choco install mingw -y
        if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to install MinGW"
            exit 1
        }
        $env:Path += ";C:\MinGW\bin"
    
    - name: Build
      run: |
        g++ -o powder.exe *.cpp -lmingw32 -lSDLmain -lSDL -lSDL_image -lSDL_ttf
        if ($LASTEXITCODE -ne 0) {
            Write-Error "Build failed"
            exit 1
        }
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: powder-windows
        path: powder.exe

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        brew install sdl sdl_image sdl_ttf
    
    - name: Build
      run: |
        chmod +x buildall.OSX.sh
        ./buildall.OSX.sh
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: powder-macos
        path: powder

  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.2.1'
        cache-read-only: false
        validate-wrappers: false

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Cache Android NDK
      uses: actions/cache@v4
      with:
        path: ${{ env.ANDROID_SDK_ROOT }}/ndk/21.4.7075529
        key: ${{ runner.os }}-android-ndk-21.4.7075529

    - name: Install Android NDK
      run: |
        yes | sdkmanager --licenses
        sdkmanager --install "ndk;21.4.7075529"

    - name: Build Android
      run: |
        cd port/android/powder
        ./gradlew --no-daemon assembleDebug

    - name: Diagnose APK outputs
      run: |
        ls -lah port/android/powder/app/build/outputs/
        ls -lah port/android/powder/app/build/outputs/apk/
        ls -lah port/android/powder/app/build/outputs/apk/debug/

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: powder-android
        path: port/android/powder/app/build/outputs/apk/debug/*.apk
